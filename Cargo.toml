[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/garo-pro/VerbaRelay"

[workspace.dependencies]
verbarelay-protocol = { path = "crates/protocol" }

anyhow = "1"
base64 = "0.23"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hkdf = "0.13"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
