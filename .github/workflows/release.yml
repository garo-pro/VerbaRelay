name: Release

# Stable releases: push a tag "vX.Y.Z" that matches the workspace version.
# Development builds: every push to main replaces the rolling "dev" pre-release.
#
# Required repository settings:
#   secret   MINISIGN_SECRET_KEY  content of a minisign secret key file
#                                 (`minisign -G -p release.pub -s release.key`)
#   secret   MINISIGN_PASSWORD    password of that key; leave unset for a key
#                                 created without one (`minisign -G -W`)
#   variable MINISIGN_PUBLIC_KEY  the base64 public key (second line of release.pub)
# Clients verify every update and the CUDA package with this public key.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  VERBARELAY_UPDATE_REPO: ${{ github.repository }}
  VERBARELAY_UPDATE_PUBKEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
  VERBARELAY_COMMIT: ${{ github.sha }}
  VULKAN_VERSION: 1.4.313.2

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.meta.outputs.label }}
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match workspace version $version"
              exit 1
            fi
            echo "label=$version" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

  client-windows:
    name: Client (Windows)
    needs: meta
    runs-on: windows-2022
    env:
      VERBARELAY_CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The engine only changes with engine/ or the toolkit versions. Bump the
      # trailing number when the build commands below change.
      - name: Cached native engine
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: dist/engine
          key: engine-${{ runner.os }}-${{ hashFiles('engine/**') }}-cuda12.8.1-vulkan${{ env.VULKAN_VERSION }}-1
      # Packaging copies cuBLAS and the CUDA runtime from the toolkit, so it is
      # installed even when the engine comes from the cache.
      # The toolkit installer is slow; the action caches the downloaded
      # installer and the installed tree between runs (use-github-cache).
      - name: CUDA toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          use-github-cache: true
      - name: Vulkan SDK
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
      - name: Native engine (CPU variants, Vulkan, CUDA)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S engine -B build/engine -G "Visual Studio 17 2022" -A x64 -DVR_VULKAN=ON -DVR_CUDA=ON -DVR_CPU_ALL_VARIANTS=ON
          cmake --build build/engine --config Release --parallel
          cmake --install build/engine --config Release --prefix dist/engine
      - name: Client
        run: cargo build --release -p verbarelay-client
      - name: Package
        shell: pwsh
        run: ./scripts/package-client.ps1 -Label "${{ needs.meta.outputs.label }}" -Binary target/release/verbarelay-client.exe -Engine dist/engine/bin -CudaBin "${{ steps.cuda.outputs.CUDA_PATH }}\bin" -Out dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: client-windows
          path: dist/release/*.zip

  client-linux:
    name: Client (Linux)
    needs: meta
    runs-on: ubuntu-22.04
    # The CUDA development image brings nvcc, the runtime and cuBLAS; Ubuntu 22.04
    # keeps the glibc requirement of the release low.
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      VERBARELAY_CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl wget ca-certificates build-essential pkg-config python3-pip zip zstd \
            libgtk-3-dev libssl-dev libclang-dev gnupg
          # The client build needs CMake, OpenSSL headers and libclang too: wxdragon
          # builds wxWidgets with CMake, its build script downloads over native-tls,
          # and it generates its FFI bindings with bindgen.
          pip3 install "cmake>=3.28"
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The engine only changes with engine/ or the toolkit versions. Bump the
      # trailing number when the build commands below change.
      - name: Cached native engine
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: dist/engine
          key: engine-${{ runner.os }}-${{ hashFiles('engine/**') }}-cuda12.8.1-vulkan-sdk-1
      - name: Vulkan SDK
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc > /etc/apt/trusted.gpg.d/lunarg.asc
          wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends vulkan-sdk
      - name: Native engine (CPU variants, Vulkan, CUDA)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DVR_VULKAN=ON -DVR_CUDA=ON -DVR_CPU_ALL_VARIANTS=ON
          # Makefiles treat a bare --parallel as unlimited jobs, and that many
          # CUDA compiles at once exhaust the runner's memory.
          cmake --build build/engine --parallel "$(nproc)"
          cmake --install build/engine --prefix dist/engine
      - name: Client
        run: cargo build --release -p verbarelay-client
      - name: Package
        run: scripts/package-client.sh "${{ needs.meta.outputs.label }}" target/release/verbarelay-client dist/engine/lib /usr/local/cuda/lib64 dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux
          path: dist/release/*.zip

  client-linux-arm:
    name: Client (Linux ARM)
    needs: meta
    # GitHub's hosted ARM runner (free for public repositories). No CUDA: the
    # package holds the CPU and Vulkan backends only.
    runs-on: ubuntu-22.04-arm
    env:
      VERBARELAY_CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl wget ca-certificates build-essential pkg-config python3-pip zip zstd \
            libgtk-3-dev libssl-dev libclang-dev gnupg libvulkan-dev glslc spirv-headers
          pip3 install "cmake>=3.28"
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cached native engine
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: dist/engine
          key: engine-${{ runner.os }}-arm64-${{ hashFiles('engine/**') }}-vulkan-1
      - name: Native engine (CPU variants, Vulkan)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DVR_VULKAN=ON -DVR_CUDA=OFF -DVR_CPU_ALL_VARIANTS=ON
          cmake --build build/engine --parallel "$(nproc)"
          cmake --install build/engine --prefix dist/engine
      - name: Client
        run: cargo build --release -p verbarelay-client
      - name: Package
        run: scripts/package-client.sh "${{ needs.meta.outputs.label }}" target/release/verbarelay-client dist/engine/lib "" dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux-arm
          path: dist/release/*.zip

  client-macos:
    name: Client (macOS)
    needs: meta
    # Apple Silicon: the engine runs on Metal with the Accelerate/BLAS fallback.
    runs-on: macos-14
    env:
      VERBARELAY_CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cached native engine
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: dist/engine
          key: engine-${{ runner.os }}-arm64-${{ hashFiles('engine/**') }}-metal-1
      - name: Native engine (Metal)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DVR_CPU_ALL_VARIANTS=OFF -DGGML_METAL=ON
          cmake --build build/engine --parallel
          cmake --install build/engine --prefix dist/engine
      - name: Client
        run: cargo build --release -p verbarelay-client
      - name: Package
        run: scripts/package-client-macos.sh "${{ needs.meta.outputs.label }}" target/release/verbarelay-client dist/engine/lib dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: client-macos
          path: dist/release/*.zip

  server-linux:
    name: Server (Linux)
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release -p verbarelay-server
      - name: Package
        run: |
          name="verbarelay-server-${{ needs.meta.outputs.label }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/verbarelay-server config/server.example.toml packaging/systemd/verbarelay-server.service LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux
          path: dist/*.tar.gz

  publish:
    name: Sign and publish
    needs: [meta, client-windows, client-linux, client-linux-arm, client-macos, server-linux]
    # Skipped until the signing key is configured (see the header of this file).
    if: vars.MINISIGN_PUBLIC_KEY != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ needs.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the MINISIGN_SECRET_KEY secret is missing"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          for file in artifacts/*.zip artifacts/*.tar.gz; do
            # minisign reads the password from stdin when it is not a terminal.
            printf '%s\n' "$MINISIGN_PASSWORD" |
              minisign -S -s "$RUNNER_TEMP/release.key" -m "$file" -t "VerbaRelay $LABEL $(basename "$file")"
          done
          rm -f "$RUNNER_TEMP/release.key"
          ls -l artifacts
      - name: Stable release
        if: needs.meta.outputs.channel == 'stable'
        run: |
          gh release create "v$LABEL" artifacts/* \
            --title "VerbaRelay $LABEL" \
            --generate-notes \
            --verify-tag
      - name: Development build
        if: needs.meta.outputs.channel == 'dev'
        run: |
          printf '{"commit":"%s","version":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "${{ needs.meta.outputs.version }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/dev-build.json
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev artifacts/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Automatic build of ${GITHUB_SHA::8}. Clients with development builds enabled install it automatically."
